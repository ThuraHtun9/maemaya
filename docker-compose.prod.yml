services:
  upload_init:
    image: busybox:1.36
    restart: "no"
    command: ["sh", "-c", "mkdir -p /uploads && chown -R 10001:10001 /uploads && chmod -R u+rwX,go+rX /uploads"]
    volumes:
      - ./uploads:/uploads

  db:
    image: postgres:16-alpine
    container_name: spring-shop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: spring-shop-app
    restart: unless-stopped
    depends_on:
      upload_init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PLATFORM: postgresql
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_UPLOAD_DIR: /app/uploads
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./uploads:/app/uploads
    expose:
      - "8080"

  caddy:
    image: caddy:2.8
    container_name: spring-shop-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
