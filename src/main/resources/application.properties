spring.application.name=spring-shop
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/springshop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:springshop}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:springshop}

spring.sql.init.mode=always
spring.sql.init.platform=${DB_PLATFORM:postgresql}
spring.messages.basename=messages
spring.messages.encoding=UTF-8

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin}
app.upload-dir=${APP_UPLOAD_DIR:uploads}
