spring.application.name=spring-shop
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/springshop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:springshop}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:springshop}

spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.messages.basename=messages
spring.messages.encoding=UTF-8

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Response compression (gzip) for smaller page transfers
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml,text/plain
server.compression.min-response-size=1024

# Static resource caching: content-hash fingerprinting so browsers can cache
# CSS/JS long-term, while any edit to the file automatically busts the cache.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin}
app.upload-dir=${APP_UPLOAD_DIR:uploads}
