<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>document.documentElement.classList.add("js-motion");window.setTimeout(function(){if(document.body){document.body.classList.add("page-ready");}},400);</script>
    <link rel="icon" type="image/jpeg" th:href="@{/images/maemaya.jpg}">
    <title th:text="#{order.form.title}">Checkout</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;700&display=swap");
        :root {
            --brand-bg: #f4eadb;
            --brand-bg-soft: #fbf4e9;
            --brand-surface: #fffaf2;
            --brand-line: #e4d0b4;
            --brand-text: #3f281b;
            --brand-muted: #7f6351;
            --brand-primary: #5c3320;
            --brand-primary-hover: #74442b;
            --brand-accent: #c99340;
            --brand-danger: #8f3c2d;
        }
        body {
            font-family: "Noto Sans Myanmar", "Padauk", "Pyidaungsu", sans-serif;
            padding: 20px;
            background: linear-gradient(160deg, var(--brand-bg) 0%, var(--brand-bg-soft) 45%, #f1e3cf 100%);
            color: var(--brand-text);
        }
        .amount-font { font-family: "Helvetica Neue", Arial, sans-serif; }
        .order-container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--brand-surface);
            border: 1px solid var(--brand-line);
            padding: 30px;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 10px 24px rgba(70, 39, 23, 0.1);
        }
        h1 {
            text-align: center;
            border-bottom: 2px solid var(--brand-line);
            padding-bottom: 10px;
            color: var(--brand-primary);
        }

        .summary {
            background: #f8efdf;
            border: 1px solid var(--brand-line);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .total-price { font-size: 1.5rem; color: var(--brand-primary); font-weight: bold; text-align: right; }

        input, select, textarea, button { font-family: inherit; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.9rem; }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid var(--brand-line);
            border-radius: 4px;
            box-sizing: border-box;
            background: #fffdf8;
            color: var(--brand-text);
        }
        .zip-search-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        .zip-search-row input { flex: 1; }
        .zip-search-btn {
            width: auto;
            margin-top: 0;
            padding: 10px 12px;
            font-size: 0.9rem;
            background-color: var(--brand-primary);
            white-space: nowrap;
        }
        .zip-search-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .zip-lookup-message {
            min-height: 1.2em;
            margin-top: 6px;
            font-size: 0.85rem;
        }
        .field-help {
            margin-top: 6px;
            font-size: 0.82rem;
            color: var(--brand-muted);
        }
        .flash {
            margin: 14px 0;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid transparent;
            font-size: 0.9rem;
        }
        .flash-error {
            background: #fff1ea;
            border-color: #e7c0ad;
            color: var(--brand-danger);
        }
        button {
            width: 100%; padding: 12px; background-color: var(--brand-primary); color: white; border: none;
            border-radius: 4px; font-size: 1.1rem; font-weight: bold; margin-top: 25px; cursor: pointer;
        }
        button:hover { background: var(--brand-primary-hover); }
        .lang-switch {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 0.85rem;
        }
        .lang-switch a { color: var(--brand-muted); text-decoration: none; margin: 0 4px; }
        .lang-switch a:hover { text-decoration: underline; }
    </style>
    <link rel="stylesheet" th:href="@{/css/smooth-ui.css}">
    <script defer th:src="@{/js/smooth-ui.js}"></script>

</head>
<body>
<div class="order-container">
    <div class="lang-switch">
        <a th:href="@{/checkout(lang='my')}" th:text="#{lang.myanmar}">မြန်မာ</a>|
        <a th:href="@{/checkout(lang='en')}" th:text="#{lang.english}">English</a>|
        <a th:href="@{/checkout(lang='ja')}" th:text="#{lang.japanese}">日本語</a>
    </div>
    <h1 th:text="#{order.form.heading}">Checkout</h1>
    <div th:if="${orderError}" class="flash flash-error" th:text="${orderError}"></div>

    <div class="summary">
        <h3 th:text="#{order.form.summary}">Order Summary</h3>
        <ul>
            <li th:each="p : ${products}">
                <span th:text="${p.name}"></span>
                (<span class="amount-font" th:text="|¥${p.price}|"></span>)
            </li>
        </ul>
        <div class="total-price">
            <span th:text="#{order.form.total}">Total:</span>
            <span class="amount-font" th:text="|¥${totalPrice}|"></span>
        </div>
    </div>

    <form th:action="@{/order/confirm}" th:object="${orderRequest}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label><span th:text="#{order.form.name}">Name</span> <span style="color:red">*</span></label>
        <input type="text" th:field="*{customerName}" required>

        <label><span th:text="#{order.form.phone}">Phone</span> <span style="color:red">*</span></label>
        <input type="tel"
               th:field="*{phone}"
               required
               inputmode="tel"
               autocomplete="tel"
               pattern="^\+?[0-9]{10,15}$"
               th:placeholder="#{order.form.phone.placeholder}">
        <div class="field-help" th:text="#{order.form.phone.help}">Enter 10-11 digits (hyphen allowed).</div>

        <label th:text="#{order.form.zip}">ZIP Code</label>
        <div class="zip-search-row">
            <input type="text" th:field="*{zipCode}">
            <button type="button" id="postalLookupBtn" class="zip-search-btn" th:text="#{order.form.postalLookup}">郵便番号で検索</button>
        </div>
        <div id="postalLookupMessage" class="zip-lookup-message"></div>

        <label><span th:text="#{order.form.address}">Address</span> <span style="color:red">*</span></label>
        <input type="text" th:field="*{address}" required>

        <label><span th:text="#{order.form.addressDetail}">Address Detail (Chome/Block/Go)</span> <span style="color: red">*</span></label>
        <input type="text" th:field="*{addressDetail}" th:placeholder="#{order.form.addressDetail.placeholder}" required>

        <label><span th:text="#{order.form.buildingName}">Building Name</span> <span style="color:red">*</span></label>
        <input type="text" th:field="*{buildingName}" th:placeholder="#{order.form.buildingName.placeholder}" required>

        <label><span th:text="#{order.form.roomNumber}">Room / House Number</span> <span style="color:red">*</span></label>
        <input type="text" th:field="*{roomNumber}" th:placeholder="#{order.form.roomNumber.placeholder}" required>

        <label th:text="#{order.form.deliveryDate}">Preferred Delivery Date</label>
        <input type="date" th:field="*{deliveryDate}" th:attr="min=${minDeliveryDate}" required>
        <div class="field-help" th:text="${#messages.msg('order.form.deliveryDate.help', minDeliveryDate)}">
            Same-day delivery is unavailable. Earliest date: tomorrow.
        </div>

        <label th:text="#{order.form.deliveryTime}">Preferred Delivery Time</label>
        <select th:field="*{deliveryTime}">
            <option value="指定なし" th:text="#{order.form.delivery.none}">No preference</option>
            <option value="午前中" th:text="#{order.form.delivery.morning}">Morning</option>
            <option value="14-16時" th:text="#{order.form.delivery.14_16}">14-16</option>
            <option value="16-18時" th:text="#{order.form.delivery.16_18}">16-18</option>
            <option value="18-20時" th:text="#{order.form.delivery.18_20}">18-20</option>
            <option value="19-21時" th:text="#{order.form.delivery.19_21}">19-21</option>
        </select>

        <button type="submit" th:text="#{order.form.submit}">Place Order</button>
    </form>

    <div style="text-align:center; margin-top:15px;">
        <a th:href="@{/cart}" style="color:#666;" th:text="#{order.form.backToCart}">Back to Cart</a>
    </div>
    <p style="margin-top:18px; text-align:center; color: var(--brand-muted); font-size:0.86rem;"
       th:text="|© ${#dates.format(#dates.createNow(), 'yyyy')} မေ့မရ|">&copy; 2026 မေ့မရ</p>
</div>
<script th:inline="javascript">
    (() => {
        const lookupUrl = /*[[@{/api/postal-lookup}]]*/ "/api/postal-lookup";
        const lookupBtn = document.getElementById("postalLookupBtn");
        const zipInput = document.getElementById("zipCode");
        const addressInput = document.getElementById("address");
        const messageBox = document.getElementById("postalLookupMessage");

        if (!lookupBtn || !zipInput || !addressInput || !messageBox) {
            return;
        }

        const fallbackNotFound = /*[[#{order.form.postalLookup.notFound}]]*/ "Address not found.";
        const fallbackFailed = /*[[#{order.form.postalLookup.failed}]]*/ "Could not search address right now.";

        function setMessage(text, success) {
            messageBox.textContent = text || "";
            messageBox.style.color = success ? "#1b5e20" : "#c62828";
        }

        lookupBtn.addEventListener("click", async () => {
            const zipCode = (zipInput.value || "").trim();
            setMessage("", false);
            lookupBtn.disabled = true;

            try {
                const response = await fetch(`${lookupUrl}?zipCode=${encodeURIComponent(zipCode)}`, {
                    method: "GET",
                    headers: { "Accept": "application/json" }
                });
                const data = await response.json();

                if (data.success) {
                    if (data.zipCode) {
                        zipInput.value = data.zipCode;
                    }
                    if (data.address) {
                        addressInput.value = data.address;
                    }
                    setMessage(data.message || "", true);
                } else {
                    setMessage(data.message || fallbackNotFound, false);
                }
            } catch (error) {
                setMessage(fallbackFailed, false);
            } finally {
                lookupBtn.disabled = false;
            }
        });
    })();
</script>
</body>
</html>
