<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="postal-lookup-url" th:content="@{/api/postal-lookup}">
    <meta name="postal-lookup-not-found-message" th:content="#{order.form.postalLookup.notFound}">
    <meta name="postal-lookup-failed-message" th:content="#{order.form.postalLookup.failed}">
    <script>document.documentElement.classList.add("js-motion");window.setTimeout(function(){if(document.body){document.body.classList.add("page-ready");}},400);</script>
    <link rel="icon" type="image/jpeg" th:href="@{/images/maemaya.jpg}">
    <title th:text="#{order.form.title}">Checkout</title>
    <link rel="stylesheet" th:href="@{/css/order_form.css}">
    <link rel="stylesheet" th:href="@{/css/smooth-ui.css}">
    <script defer th:src="@{/js/smooth-ui.js}"></script>
    <script defer th:src="@{/js/order_form.js}"></script>

</head>
<body>
<div class="order-container">
    <div class="lang-switch">
        <a th:href="@{/checkout(lang='my')}" th:text="#{lang.myanmar}">မြန်မာ</a>|
        <a th:href="@{/checkout(lang='en')}" th:text="#{lang.english}">English</a>|
        <a th:href="@{/checkout(lang='ja')}" th:text="#{lang.japanese}">日本語</a>
    </div>
    <h1 th:text="#{order.form.heading}">Checkout</h1>
    <div th:if="${orderError}" class="flash flash-error" th:text="${orderError}"></div>

    <div class="summary">
        <h3 th:text="#{order.form.summary}">Order Summary</h3>
        <ul>
            <li th:each="p : ${products}">
                <span th:text="${p.name}"></span>
                (<span class="amount-font" th:text="|¥${p.price}|"></span>)
            </li>
        </ul>
        <div class="total-price">
            <span th:text="#{order.form.total}">Total:</span>
            <span class="amount-font" th:text="|¥${totalPrice}|"></span>
        </div>
    </div>

    <form th:action="@{/order/confirm}" th:object="${orderRequest}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label><span th:text="#{order.form.name}">Name</span> <span style="color:red">*</span></label>
        <input type="text" th:field="*{customerName}" required>

        <label><span th:text="#{order.form.phone}">Phone</span> <span style="color:red">*</span></label>
        <input type="tel"
               th:field="*{phone}"
               required
               inputmode="tel"
               autocomplete="tel"
               pattern="^\+?[0-9]{10,15}$"
               th:placeholder="#{order.form.phone.placeholder}">
        <div class="field-help" th:text="#{order.form.phone.help}">Enter 10-11 digits (hyphen allowed).</div>

        <label th:text="#{order.form.zip}">ZIP Code</label>
        <div class="zip-search-row">
            <input type="text" th:field="*{zipCode}">
            <button type="button" id="postalLookupBtn" class="zip-search-btn" th:text="#{order.form.postalLookup}">郵便番号で検索</button>
        </div>
        <div id="postalLookupMessage" class="zip-lookup-message"></div>

        <label><span th:text="#{order.form.address}">Address</span> <span style="color:red">*</span></label>
        <input type="text" th:field="*{address}" required>

        <label><span th:text="#{order.form.addressDetail}">Address Detail (Chome/Block/Go)</span> <span style="color: red">*</span></label>
        <input type="text" th:field="*{addressDetail}" th:placeholder="#{order.form.addressDetail.placeholder}" required>

        <label><span th:text="#{order.form.buildingName}">Building Name</span> <span style="color:red">*</span></label>
        <input type="text" th:field="*{buildingName}" th:placeholder="#{order.form.buildingName.placeholder}" required>

        <label><span th:text="#{order.form.roomNumber}">Room / House Number</span> <span style="color:red">*</span></label>
        <input type="text" th:field="*{roomNumber}" th:placeholder="#{order.form.roomNumber.placeholder}" required>

        <label th:text="#{order.form.deliveryDate}">Preferred Delivery Date</label>
        <input type="date" th:field="*{deliveryDate}" th:attr="min=${minDeliveryDate}" required>
        <div class="field-help" th:text="${#messages.msg('order.form.deliveryDate.help', minDeliveryDate)}">
            Same-day delivery is unavailable. Earliest date: tomorrow.
        </div>

        <label th:text="#{order.form.deliveryTime}">Preferred Delivery Time</label>
        <select th:field="*{deliveryTime}">
            <option value="指定なし" th:text="#{order.form.delivery.none}">No preference</option>
            <option value="午前中" th:text="#{order.form.delivery.morning}">Morning</option>
            <option value="14-16時" th:text="#{order.form.delivery.14_16}">14-16</option>
            <option value="16-18時" th:text="#{order.form.delivery.16_18}">16-18</option>
            <option value="18-20時" th:text="#{order.form.delivery.18_20}">18-20</option>
            <option value="19-21時" th:text="#{order.form.delivery.19_21}">19-21</option>
        </select>

        <button type="submit" th:text="#{order.form.submit}">Place Order</button>
    </form>

    <div style="text-align:center; margin-top:15px;">
        <a th:href="@{/cart}" style="color:#666;" th:text="#{order.form.backToCart}">Back to Cart</a>
    </div>
    <p style="margin-top:18px; text-align:center; color: var(--brand-muted); font-size:0.86rem;"
       th:text="|© ${#dates.format(#dates.createNow(), 'yyyy')} မေ့မရ|">&copy; 2026 မေ့မရ</p>
</div>
</body>
</html>
