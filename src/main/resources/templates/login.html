<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>document.documentElement.classList.add("js-motion");window.setTimeout(function(){if(document.body){document.body.classList.add("page-ready");}},400);</script>
    <link rel="icon" type="image/jpeg" th:href="@{/images/maemaya.jpg}">
    <title th:text="${loginTitle}">Admin Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/smooth-ui.css}">
    <script defer th:src="@{/js/smooth-ui.js}"></script>

</head>
<body class="login-page">
<div class="login-box">
    <div class="login-lang">
        <a th:href="@{/login-my(error=${param.error != null ? '1' : null},logout=${param.logout != null ? '1' : null})}">မြန်မာ</a> |
        <a th:href="@{/login-en(error=${param.error != null ? '1' : null},logout=${param.logout != null ? '1' : null})}">English</a> |
        <a th:href="@{/login-ja(error=${param.error != null ? '1' : null},logout=${param.logout != null ? '1' : null})}">日本語</a>
    </div>
    <div class="login-logo-wrap">
        <img th:src="@{/images/maemaya.jpg}" class="login-logo" alt="Mae Ma Ya logo">
    </div>
    <h2 th:text="${loginHeading}">Admin Login</h2>
    <div th:if="${logoutMessage}" class="flash-notice" th:text="${logoutMessage}">Logged out.</div>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div style="margin-bottom: 15px; text-align: left;">
            <label th:text="${loginUsername}">Username</label>
            <input type="text" name="username" required style="width:100%; padding:8px; box-sizing:border-box;" th:placeholder="${loginUsernamePlaceholder}">
        </div>
        <div style="margin-bottom: 15px; text-align: left;">
            <label th:text="${loginPassword}">Password</label>
            <input type="password" name="password" required style="width:100%; padding:8px; box-sizing:border-box;" th:placeholder="${loginPasswordPlaceholder}">
        </div>
        <button type="submit" class="login-btn" th:text="${loginSubmit}">Login</button>
    </form>

    <p style="margin-top: 15px;"><a th:href="@{/}" th:text="${navShopBack}">Back to Shop</a></p>
    <p style="margin-top:16px; text-align:center; color: var(--brand-muted); font-size:0.86rem;"
       th:text="|© ${#dates.format(#dates.createNow(), 'yyyy')} မေ့မရ|">&copy; 2026 မေ့မရ</p>
</div>
</body>
</html>
