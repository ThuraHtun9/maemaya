<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="cart-clear-confirm-message" th:content="#{cart.clear.confirm}">
    <script>document.documentElement.classList.add("js-motion");window.setTimeout(function(){if(document.body){document.body.classList.add("page-ready");}},400);</script>
    <link rel="icon" type="image/jpeg" th:href="@{/images/maemaya.jpg}">
    <title th:text="#{cart.title}">Cart</title>
    <link rel="stylesheet" th:href="@{/css/cart.css}">
    <link rel="stylesheet" th:href="@{/css/smooth-ui.css}">
    <script defer th:src="@{/js/smooth-ui.js}"></script>
    <script defer th:src="@{/js/cart.js}"></script>

</head>
<body>
<div class="cart-container">
    <div class="lang-switch">
        <a th:href="@{/cart(lang='my')}" th:text="#{lang.myanmar}">မြန်မာ</a>|
        <a th:href="@{/cart(lang='en')}" th:text="#{lang.english}">English</a>|
        <a th:href="@{/cart(lang='ja')}" th:text="#{lang.japanese}">日本語</a>
    </div>
    <h1 th:text="#{cart.heading}">Shopping Cart</h1>

    <div id="cartContent" th:fragment="cartContent">
        <div th:if="${!#lists.isEmpty(cartItems)}">
            <div class="cart-table-wrap">
            <table class="stack-table">
                <thead>
                <tr>
                    <th th:text="#{cart.col.product}">Product</th>
                    <th th:text="#{cart.col.unitPrice}">Unit Price</th>
                    <th th:text="#{cart.col.subtotal}">Subtotal</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${cartItems}">
                    <td class="cell-product" th:attr="data-label=#{cart.col.product}">
                        <div class="product-cell">
                            <img th:if="${item.product.hasImage()}"
                                 th:src="@{/images/{image}(image=${item.product.image})}"
                                 class="product-thumb"
                                 loading="lazy"
                                 decoding="async"
                                 th:alt="#{index.product.imageAlt}">
                            <div class="product-info">
                                <span class="product-name" th:text="${item.product.name}"></span>
                                <div class="qty-stepper" th:attr="data-product-id=${item.product.id}">
                                    <button type="button" class="qty-btn qty-btn-minus" aria-label="Decrease quantity">−</button>
                                    <span class="qty-value amount-font" th:text="${item.quantity}"></span>
                                    <button type="button" class="qty-btn qty-btn-plus" aria-label="Increase quantity">+</button>
                                </div>
                            </div>
                        </div>
                    </td>
                    <td class="cell-unit amount-font" th:attr="data-label=#{cart.col.unitPrice}" th:text="|¥${item.product.price}|"></td>
                    <td class="cell-subtotal amount-font" th:attr="data-label=#{cart.col.subtotal}" th:text="|¥${item.subtotal}|"></td>
                </tr>
                </tbody>
            </table>
            </div>

            <div class="total-area">
                <span th:text="#{cart.total}">Total:</span>
                <span class="amount-font" th:text="|¥${totalPrice}|"></span>
            </div>
            <a th:href="@{/checkout}" class="btn-checkout" th:text="#{cart.checkout}">Proceed to Checkout</a>
            <button type="button" id="clearCartBtn" class="btn-clear-cart" th:text="#{cart.clear}">Clear Cart</button>
        </div>

        <p style="text-align: center; padding: 50px;" th:if="${#lists.isEmpty(cartItems)}" th:text="#{cart.empty}">Your cart is empty.</p>
    </div>

    <a th:href="@{/}" class="back-link" th:text="#{nav.backShopping}">Continue Shopping</a>
    <p style="margin-top:18px; text-align:center; color: var(--brand-muted); font-size:0.86rem;"
       th:text="|© ${#dates.format(#dates.createNow(), 'yyyy')} မေ့မရ|">&copy; 2026 မေ့မရ</p>
</div>
</body>
</html>
